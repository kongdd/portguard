# VPS 自身 SSH 端口；按实际值修改。放在所有 [表] 之前。
protected_ports = [22]

# 可选：记录被拦截来源，供 portguard audit 查询。默认 false。
log_denied = true

# 默认 enabled=true。全局关闭也可执行 portguard disable。
# enabled = true

[rules.ssh]
ports = ["23-28"]
allow = [
    "39.180.226.28",
    "113.57.5.82",
    "113.57.0.0/16",
    "198.51.100.0/24",
]

