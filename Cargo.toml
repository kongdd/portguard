[package]
name = "portguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Simple port and IP allowlists powered by nftables"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
unicode-width = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
